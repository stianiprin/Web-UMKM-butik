<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Tidak Ditemukan | Aura Atelier</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #faf9f6;
            color: #2c2c2c;
            text-align: center;
            padding: 20px;
        }
        .error-container h1 {
            font-size: 6rem;
            font-weight: 300;
            letter-spacing: 4px;
            color: #1a1a1a;
        }
        .error-container h2 {
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .error-container p {
            color: #666;
            margin-bottom: 30px;
            max-width: 400px;
        }
        .btn-back {
            display: inline-block;
            padding: 12px 30px;
            background-color: #1a1a1a;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .btn-back:hover {
            background-color: #333333;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <h2>Halaman Tidak Ditemukan</h2>
        <p>Maaf, halaman yang Anda cari tidak tersedia atau telah dipindahkan.</p>
        <a href="index.html" class="btn-back">Kembali ke Beranda</a>
    </div>
</body>
</html>
